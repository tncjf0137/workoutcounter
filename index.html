<title>운동 카운터</title>
<style>
:root {
  --orange:#E8650A; --orange-dim:rgba(232,101,10,0.15);
  --bg:#0f0f0f; --bg2:#1a1a1a; --bg3:#242424;
  --border:#2a2a2a; --border2:#333;
  --text:#fff; --text2:#aaa; --text3:#666; --text4:#444;
  --green:#34c759; --red:#ff453a; --radius:16px; --radius-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;min-height:100dvh;display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;overflow-x:hidden}

.page{display:none;width:100%;flex-direction:column;align-items:center}
.page.active{display:flex}

/* WEEKLY STRIP */
#weekly-strip{width:100%;padding:14px 16px 10px;background:var(--bg)}
#weekly-label{font-size:11px;color:var(--text4);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
#weekly-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wday{display:flex;flex-direction:column;align-items:center;gap:5px}
.wday-name{font-size:11px;color:var(--text4)}
.wday-circle{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;background:var(--bg2);color:var(--text3);position:relative;transition:all .2s}
.wday-circle.today{border:2px solid var(--orange);color:var(--text);background:var(--bg2)}
.wday-circle.did{background:var(--green);color:#fff}
.wday-circle.missed{background:var(--bg2);color:var(--red)}
.wday-circle.future{background:var(--bg2);color:var(--text4)}
#streak-line{width:calc(100% - 32px);display:flex;align-items:center;justify-content:space-between;margin:6px 0 2px;font-size:12px;color:var(--text3)}
#streak-line b{color:var(--orange)}

/* EXERCISE ROW */
#exercise-row{display:flex;gap:8px;padding:10px 16px 6px;width:100%;overflow-x:auto;scrollbar-width:none;align-items:center}
#exercise-row::-webkit-scrollbar{display:none}
.ex-chip{flex-shrink:0;padding:8px 18px;border-radius:100px;border:1px solid var(--border2);background:transparent;color:var(--text3);font-size:14px;cursor:pointer;font-family:inherit;touch-action:manipulation;transition:all .15s}
.ex-chip.active{background:var(--orange);border-color:var(--orange);color:#fff}
#edit-ex-btn{flex-shrink:0;width:32px;height:32px;border-radius:50%;border:1px solid var(--border2);background:transparent;color:var(--text3);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
#edit-ex-btn:active{background:var(--bg2)}

/* STATUS BAR */
#status-bar{width:100%;display:flex;align-items:center;justify-content:space-between;padding:4px 20px 4px}
#set-info{font-size:14px;color:var(--text3)}
#set-info b{color:var(--orange)}
#today-start{font-size:12px;color:var(--text4)}

/* TIMERS ROW */
#timers-row{width:100%;display:flex;gap:8px;padding:4px 16px 6px}
.timer-box{flex:1;background:var(--bg2);border-radius:var(--radius-sm);padding:10px 14px;display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden}
.timer-box.active-timer::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--orange);animation:pulse-bar 1s ease-in-out infinite alternate}
@keyframes pulse-bar{from{opacity:.4}to{opacity:1}}
.timer-label{font-size:10px;color:var(--text4);letter-spacing:.08em;text-transform:uppercase}
.timer-val{font-size:22px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#rest-timer-box .timer-val{color:var(--orange)}

/* GOAL ROW */
#goal-row{width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 20px 6px;gap:12px}
.goal-section{display:flex;align-items:center;gap:8px}
.goal-label{font-size:12px;color:var(--text3)}
.goal-val-btn{background:var(--bg2);border:1px solid var(--border2);color:var(--text);font-size:13px;width:40px;text-align:center;padding:5px 2px;border-radius:8px;cursor:pointer;font-family:inherit;touch-action:manipulation}
#decay-label{font-size:11px;color:var(--text4)}

/* PROGRESS */
#progress-wrap{width:calc(100% - 32px);height:4px;background:var(--bg2);border-radius:100px;overflow:hidden;margin-bottom:4px}
#progress-bar{height:100%;background:var(--orange);border-radius:100px;transition:width .25s ease;width:0%}

/* COUNT DISPLAY */
#count-area{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:.5rem 0;width:100%}
#count-display{font-size:clamp(90px,20vw,150px);font-weight:200;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em;transition:transform .08s ease,color .2s}
#count-display.pop{transform:scale(1.08)}
#count-display.goal-reached{color:var(--orange)}
#ex-label{font-size:13px;color:var(--text4);letter-spacing:.15em;text-transform:uppercase}

/* COOLDOWN RING */
#cooldown-ring-wrap{position:relative;margin:4px 0}
#cooldown-svg{width:230px;height:230px;transform:rotate(-90deg)}
#cooldown-track{fill:none;stroke:var(--bg2);stroke-width:6}
#cooldown-arc{fill:none;stroke:var(--orange);stroke-width:6;stroke-linecap:round;stroke-dasharray:628;stroke-dashoffset:628;transition:stroke-dashoffset .05s linear}
#big-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:195px;height:195px;border-radius:50%;background:var(--bg2);border:1px solid var(--border);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;outline:none;touch-action:manipulation;transition:background .1s,transform .08s,border-color .1s}
#big-btn:active,#big-btn.pressed{background:var(--bg3);border-color:var(--orange);transform:translate(-50%,-50%) scale(0.93)}
#big-btn.locked{opacity:.45;cursor:not-allowed}
#btn-icon{width:48px;height:48px;stroke:var(--text);stroke-width:1.2;fill:none;pointer-events:none}

/* REST BANNER */
#rest-banner{display:none;width:calc(100% - 32px);background:var(--orange-dim);border:1px solid var(--orange);border-radius:var(--radius);padding:12px 20px;flex-direction:row;align-items:center;justify-content:space-between;margin-bottom:4px}
#rest-banner.show{display:flex}
#rest-title{font-size:13px;color:var(--orange);margin-bottom:2px}
#rest-countdown{font-size:26px;font-weight:300;font-variant-numeric:tabular-nums}
#skip-rest{background:none;border:1px solid var(--orange);color:var(--orange);font-size:13px;padding:8px 16px;border-radius:100px;cursor:pointer;font-family:inherit;touch-action:manipulation}
#skip-rest:active{background:var(--orange-dim)}

/* BOTTOM ACTION BAR */
#action-bar{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 16px 20px}
.action-btn{padding:12px 20px;border-radius:100px;border:1px solid var(--border2);background:var(--bg2);color:var(--text);font-size:14px;cursor:pointer;font-family:inherit;touch-action:manipulation;transition:all .15s}
.action-btn:active{background:var(--bg3)}
#set-done-btn{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:500}
#set-done-btn:active{opacity:.85}

/* NAVBAR */
#nav-bar{position:fixed;bottom:0;left:0;right:0;height:60px;background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;z-index:100}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text4);font-size:10px;cursor:pointer;background:none;border:none;font-family:inherit;touch-action:manipulation}
.tab.active{color:var(--orange)}
.tab-icon{width:22px;height:22px;stroke:currentColor;stroke-width:1.8;fill:none}

/* MODAL */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal-card{width:100%;max-width:360px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:16px}
.modal-header{display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:16px;font-weight:600}
.modal-close{background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;touch-action:manipulation}
#ex-edit-list{display:flex;flex-direction:column;gap:8px;max-height:240px;overflow-y:auto}
.ex-edit-item{display:flex;align-items:center;justify-content:space-between;background:var(--bg);padding:8px 12px;border-radius:var(--radius-sm);gap:8px}
.ex-edit-name{background:none;border:none;color:var(--text);font-size:14px;font-family:inherit;width:100%}
.ex-edit-name:focus{outline:none}
.ex-del-btn{background:none;border:none;color:var(--red);font-size:16px;cursor:pointer;padding:2px 6px;touch-action:manipulation}
.ex-add-row{display:flex;gap:8px}
#new-ex-input{flex:1;background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:10px 12px;color:var(--text);font-size:14px;font-family:inherit}
#new-ex-input:focus{outline:none;border-color:var(--orange)}
#add-ex-btn{padding:10px 20px;border-radius:100px;border:none;background:var(--orange);color:#fff;font-size:14px;cursor:pointer;font-family:inherit;touch-action:manipulation;white-space:nowrap}

/* PAGES */
#cal-page,#history-page,#settings-page{padding:16px;gap:12px;padding-bottom:80px}
#cal-header{display:flex;align-items:center;justify-content:space-between;width:100%;padding:4px 0}
#cal-title{font-size:18px;font-weight:500}
.cal-btn{background:var(--bg2);border:1px solid var(--border2);color:var(--text);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);width:100%;text-align:center;margin-top:8px}
.cal-wd{font-size:11px;color:var(--text4);padding:4px 0}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;width:100%}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%;font-size:14px;color:var(--text2);position:relative}
.cal-day.today{background:var(--bg2);color:var(--text);font-weight:600;border:1px solid var(--orange)}
.cal-day.did-workout{color:var(--green)}
.cal-day.did-workout::after{content:'✓';position:absolute;bottom:2px;font-size:8px;color:var(--green)}
.cal-day.missed{color:var(--red)}
#streak-card{width:100%;background:var(--bg2);border-radius:var(--radius);padding:16px;display:flex;justify-content:space-around;text-align:center;margin-top:8px}
.streak-val{font-size:28px;font-weight:300;color:var(--orange)}
.streak-label{font-size:11px;color:var(--text4);margin-top:2px}

/* HISTORY PAGE */
#history-list{width:100%}
.history-day{margin-bottom:20px}
.history-date{font-size:12px;color:var(--text4);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.history-card{background:var(--bg2);border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.history-ex{font-size:14px;font-weight:500}
.history-meta{font-size:12px;color:var(--text3);margin-top:2px}
.history-count{font-size:20px;font-weight:300;color:var(--orange)}
#clear-history-btn{background:none;border:1px solid var(--border2);color:var(--text4);font-size:13px;padding:10px 24px;border-radius:100px;cursor:pointer;font-family:inherit;touch-action:manipulation}

/* SETTINGS PAGE */
.settings-section{width:100%;margin-bottom:24px}
.settings-title{font-size:12px;color:var(--text4);letter-spacing:.1em;text-transform:uppercase;padding:0 4px 8px}
.setting-row{background:var(--bg2);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.setting-row:first-of-type{border-top-left-radius:var(--radius-sm);border-top-right-radius:var(--radius-sm)}
.setting-row:last-of-type{border-bottom-left-radius:var(--radius-sm);border-bottom-right-radius:var(--radius-sm);border-bottom:none}
.setting-left{display:flex;flex-direction:column;gap:2px}
.setting-label{font-size:14px;color:var(--text)}
.setting-sub{font-size:11px;color:var(--text3)}
.stepper{display:flex;align-items:center;gap:8px;background:var(--bg);padding:4px;border-radius:100px;border:1px solid var(--border2)}
.step-btn{width:28px;height:28px;border-radius:50%;border:none;background:var(--bg3);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.step-val{font-size:13px;width:32px;text-align:center}
.toggle{width:44px;height:24px;background:var(--bg3);border-radius:100px;padding:2px;cursor:pointer;transition:background .2s;touch-action:manipulation}
.toggle.on{background:var(--orange)}
.toggle-thumb{width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle.on .toggle-thumb{transform:translateX(20px)}

/* TOAST */
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-60px);background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:10px 20px;border-radius:100px;font-size:13px;pointer-events:none;opacity:0;transition:all .25s ease;z-index:300;white-space:nowrap}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>

<!-- WORKOUT PAGE -->
<div id="workout-page" class="page active">

  <!-- WEEKLY STRIP -->
  <div id="weekly-strip">
    <div id="weekly-label">이번 주</div>
    <div id="weekly-days"></div>
    <div id="streak-line">연속 <b id="mini-streak">0</b>일 · 총 <b id="mini-total">0</b>일 운동</div>
  </div>

  <div id="exercise-row">
    <!-- chips injected by JS -->
    <button id="edit-ex-btn" title="종목 편집">✎</button>
  </div>

  <div id="status-bar">
    <div id="set-info">세트 <b id="cur-set-num">1</b></div>
    <div id="today-start"></div>
  </div>

  <!-- SINGLE REST TIMER ROW -->
  <div id="timers-row">
    <div class="timer-box" id="rest-timer-box">
      <div class="timer-label">⏱ 현재 휴식 시간</div>
      <div class="timer-val" id="rest-timer-val">0:00</div>
    </div>
  </div>

  <div id="goal-row">
    <div class="goal-section">
      <span class="goal-label">목표</span>
      <button class="goal-val-btn" id="goal-minus">−</button>
      <span id="goal-num" style="font-size:14px;font-weight:600">30</span>
      <button class="goal-val-btn" id="goal-plus">+</button>
    </div>
    <div id="decay-label"></div>
  </div>

  <div id="progress-wrap"><div id="progress-bar"></div></div>

  <div id="count-area">
    <div id="count-display">0</div>
    <div id="ex-label">—</div>
    <div id="cooldown-ring-wrap">
      <svg id="cooldown-svg" viewBox="0 0 230 230">
        <circle id="cooldown-track" cx="115" cy="115" r="100"/>
        <circle id="cooldown-arc" cx="115" cy="115" r="100"/>
      </svg>
      <button id="big-btn" aria-label="카운트">
        <svg id="btn-icon" viewBox="0 0 48 48"><line x1="24" y1="10" x2="24" y2="38"/><line x1="10" y1="24" x2="38" y2="24"/></svg>
      </button>
    </div>
  </div>

  <div id="rest-banner">
    <div>
      <div id="rest-title">💤 세트 휴식 중</div>
      <div id="rest-countdown">0:30</div>
    </div>
    <button id="skip-rest">건너뛰기</button>
  </div>

  <div id="action-bar">
    <button class="action-btn" id="undo-btn">↩ 되돌리기</button>
    <button class="action-btn" id="reset-btn">↺ 리셋</button>
    <button class="action-btn" id="set-done-btn">✓ 세트 완료</button>
  </div>
</div>

<!-- CALENDAR PAGE -->
<div id="cal-page" class="page">
  <div id="cal-header">
    <button class="cal-btn" id="cal-prev">‹</button>
    <div id="cal-title"></div>
    <button class="cal-btn" id="cal-next">›</button>

<div class="modal-overlay" id="ex-modal">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title">운동 종목 편집</div>
      <button class="modal-close" id="close-ex-modal">✕</button>

    <div class="ex-add-row">
      <input type="text" id="new-ex-input" placeholder="새 종목 이름" maxlength="10">
      <button id="add-ex-btn">추가</button>
    </div>
  </div>

<div id="toast"></div>

<script>
// CONFIG
const DEFAULT_CFG = {
  baseGoal: 30, goalDecay: 3, goalDecayOn: true,
  minGoal: 5, cooldown: 0.8, cooldownOn: true,
  restTime: 30, restTimeOn: true, sound: true, vibration: true
};
let cfg = JSON.parse(localStorage.getItem('wc_cfg') || 'null') || {...DEFAULT_CFG};
function saveCfg(){ localStorage.setItem('wc_cfg', JSON.stringify(cfg)); }

const settingMeta = {
  baseGoal: {min:1, max:999}, goalDecay: {min:0, max:50},
  cooldown: {min:0.1, max:3.0}, restTime: {min:5, max:300}
};

// AUDIO
let audioCtx = null;
function initAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playClick(freq=800, dur=0.04, vol=0.15){
  if(!cfg.sound) return; initAudio();
  try{
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  }catch(e){}
}
function playGoal(){ if(!cfg.sound) return; playClick(523,0.1,0.2); setTimeout(()=>playClick(659,0.1,0.2),100); setTimeout(()=>playClick(783,0.15,0.2),200); }
function playSet(){ if(!cfg.sound) return; playClick(440,0.08,0.2); setTimeout(()=>playClick(880,0.12,0.2),90); }
function vib(pattern){ if(cfg.vibration && navigator.vibrate) navigator.vibrate(pattern); }

// EXERCISES
const DEFAULT_EX = ['스쿼트', '푸시업', '풀업', '런지'];
function getExercises(){ return JSON.parse(localStorage.getItem('wc_ex') || 'null') || [...DEFAULT_EX]; }
function saveExercises(list){ localStorage.setItem('wc_ex', JSON.stringify(list)); }

function renderExChips(){
  const row = document.getElementById('exercise-row');
  const editBtn = document.getElementById('edit-ex-btn');
  row.querySelectorAll('.ex-chip').forEach(c => c.remove());
  const exList = getExercises();
  exList.forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'ex-chip' + (name === currentEx ? ' active' : '');
    btn.dataset.ex = name; btn.textContent = name;
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      document.querySelectorAll('.ex-chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      currentEx = name;
      document.getElementById('ex-label').textContent = name;
      resetCount(); curSet = 1; document.getElementById('cur-set-num').textContent = '1';
      updateGoalDisplay(); stopSetRest(); stopRestTimer(); endCooldown();
    });
    row.insertBefore(btn, editBtn);
  });
  if(!exList.includes(currentEx) && exList.length > 0){
    currentEx = exList[0];
    document.getElementById('ex-label').textContent = currentEx;
    const first = row.querySelector('.ex-chip');
    if(first) first.classList.add('active');
  }
}

// STATE
let count = 0, countHistory = [], curSet = 1;
let currentEx = getExercises()[0] || '운동';
let goalReachedPlayed = false, sessionGoal = cfg.baseGoal;

// TIMERS
let restPauseTimer = null, restPauseRemaining = 0;
let restTimer = null, restSec = 0;
let cooldownActive = false, cooldownAnimFrame = null;
const CIRCUMFERENCE = 2 * Math.PI * 100;

// ELEMENTS
const display = document.getElementById('count-display');
const goalNumEl = document.getElementById('goal-num');
const decayLabel = document.getElementById('decay-label');
const progressBar = document.getElementById('progress-bar');
const curSetNumEl = document.getElementById('cur-set-num');
const bigBtn = document.getElementById('big-btn');
const cooldownArc = document.getElementById('cooldown-arc');
const restBanner = document.getElementById('rest-banner');
const restCountdown = document.getElementById('rest-countdown');
const todayStartEl = document.getElementById('today-start');

// REST TIMER (휴식 시 작동 / 운동 시 정지)
function startRestTimer() {
  if (restTimer) return;
  restSec = 0;
  const box = document.getElementById('rest-timer-box');
  if (box) box.classList.add('active-timer');
  restTimer = setInterval(() => {
    restSec++;
    const m = Math.floor(restSec / 60), s = restSec % 60;
    const valEl = document.getElementById('rest-timer-val');
    if (valEl) valEl.textContent = m + ':' + String(s).padStart(2, '0');
  }, 1000);
}

function stopRestTimer() {
  if (restTimer) {
    clearInterval(restTimer);
    restTimer = null;
  }
  const box = document.getElementById('rest-timer-box');
  if (box) box.classList.remove('active-timer');
}

// SET REST BANNER
function startSetRest(){
  if(!cfg.restTimeOn || cfg.restTime <= 0) return;
  restPauseRemaining = cfg.restTime;
  restBanner.classList.add('show');
  updateSetRestDisplay();
  clearInterval(restPauseTimer);
  restPauseTimer = setInterval(() => {
    restPauseRemaining--; updateSetRestDisplay();
    if(restPauseRemaining <= 0) stopSetRest();
  }, 1000);
}
function stopSetRest(){ clearInterval(restPauseTimer); restBanner.classList.remove('show'); }
function updateSetRestDisplay(){
  const m = Math.floor(restPauseRemaining / 60), s = restPauseRemaining % 60;
  restCountdown.textContent = m + ':' + String(s).padStart(2, '0');
}

// COOLDOWN
function startCooldown(){
  if(!cfg.cooldownOn || cfg.cooldown <= 0) return;
  cooldownActive = true; bigBtn.classList.add('locked');
  const duration = cfg.cooldown * 1000, start = Date.now();
  function animate(){
    const elapsed = Date.now() - start;
    const progress = Math.min(elapsed / duration, 1);
    cooldownArc.style.strokeDashoffset = CIRCUMFERENCE * (1 - progress);
    if(progress < 1){ cooldownAnimFrame = requestAnimationFrame(animate); }
    else{ endCooldown(); }
  }
  cooldownAnimFrame = requestAnimationFrame(animate);
}
function endCooldown(){
  cooldownActive = false; bigBtn.classList.remove('locked');
  cooldownArc.style.strokeDashoffset = CIRCUMFERENCE;
  cancelAnimationFrame(cooldownAnimFrame);
}

// TODAY START
function checkTodayStart() {
  const todayKey = new Date().toLocaleDateString();
  const savedDate = localStorage.getItem('wc_today_date');
  if (savedDate !== todayKey) {
    const now = new Date();
    localStorage.setItem('wc_today_date', todayKey);
    localStorage.setItem('wc_start_time', now.getTime());
    todayStartEl.textContent = '오늘 시작 ' + now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0');
  } else {
    const savedTime = new Date(parseInt(localStorage.getItem('wc_start_time')));
    todayStartEl.textContent = '오늘 시작 ' + savedTime.getHours() + ':' + String(savedTime.getMinutes()).padStart(2, '0');
  }
}

function dateKey(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

// RECORDS
function saveRecord(exName, setNum, cnt){
  const records = JSON.parse(localStorage.getItem('wc_records') || '[]');
  const now = new Date();
  records.unshift({id: Date.now(), ex: exName, set: setNum, count: cnt, time: now.toISOString()});
  localStorage.setItem('wc_records', JSON.stringify(records));

  const today = dateKey(now);
  const days = JSON.parse(localStorage.getItem('wc_days') || '{}');
  if(!days[today]) days[today] = {start: now.toISOString(), sets: []};
  days[today].sets.push({ex: exName, set: setNum, count: cnt, time: now.toISOString()});
  localStorage.setItem('wc_days', JSON.stringify(days));
}

// GOAL
function computeGoal(setNum){ if(!cfg.goalDecayOn) return cfg.baseGoal; return Math.max(cfg.minGoal, cfg.baseGoal - cfg.goalDecay * (setNum - 1)); }
function updateGoalDisplay(){
  sessionGoal = computeGoal(curSet);
  goalNumEl.textContent = sessionGoal;
  const next = computeGoal(curSet + 1);
  decayLabel.textContent = (cfg.goalDecayOn && next < sessionGoal) ? '다음 세트 → ' + next + '개' : '';
  updateProgress();
}
function updateProgress(){
  progressBar.style.width = Math.min(count / sessionGoal * 100, 100) + '%';
  count >= sessionGoal ? display.classList.add('goal-reached') : display.classList.remove('goal-reached');
}

// MAIN ACTIONS
function increment(){
  if(cooldownActive){ vib(10); return; }
  
  checkTodayStart();
  stopRestTimer();

  countHistory.push(count); if(countHistory.length > 100) countHistory.shift();
  count++; display.textContent = count;
  display.classList.remove('pop'); void display.offsetWidth; display.classList.add('pop');
  setTimeout(() => display.classList.remove('pop'), 120);
  vib(25); playClick(); updateProgress();
  if(count === sessionGoal && !goalReachedPlayed){ goalReachedPlayed = true; playGoal(); vib([50,30,80]); showToast('🎯 목표 달성!', true); }
  startCooldown();

  const cd = cfg.cooldownOn ? cfg.cooldown * 1000 : 300;
  setTimeout(() => {
    startRestTimer();
  }, cd + 50);
}

function undo(){
  if(!countHistory.length) return;
  count = countHistory.pop(); display.textContent = count;
  display.classList.add('flash'); setTimeout(() => display.classList.remove('flash'), 180);
  goalReachedPlayed = count >= sessionGoal; updateProgress(); playClick(440,0.06,0.1);
}

function resetCount(){
  countHistory = []; count = 0; goalReachedPlayed = false;
  display.textContent = '0'; display.classList.remove('goal-reached');
  display.classList.add('flash'); setTimeout(() => display.classList.remove('flash'), 180);
  updateProgress(); endCooldown(); stopRestTimer();
}

function completeSet(){
  if(count === 0){ showToast('먼저 운동하세요!'); return; }
  saveRecord(currentEx, curSet, count);
  const done = curSet; curSet++; curSetNumEl.textContent = curSet;
  resetCount(); updateGoalDisplay();
  startSetRest(); playSet(); vib([40,20,60]);
  showToast('세트 ' + done + ' 완료! 💪', true);
  renderWeeklyStrip();
}

// TOAST
let toastTmr = null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show';
  clearTimeout(toastTmr); toastTmr = setTimeout(() => t.className = '', 2200);
}

// WEEKLY STRIP
function renderWeeklyStrip(){
  const days = JSON.parse(localStorage.getItem('wc_days') || '{}');
  const now = new Date();
  const todayKey = dateKey(now);
  const todayDow = now.getDay();
  const container = document.getElementById('weekly-days');
  const dayNames = ['일','월','화','수','목','금','토'];
  let html = '';
  for(let i = 0; i < 7; i++){
    const d = new Date(now);
    d.setDate(now.getDate() - todayDow + i);
    const key = dateKey(d);
    const isFuture = d > now && key !== todayKey;
    const isToday = key === todayKey;
    const didWork = days[key] && days[key].sets && days[key].sets.length > 0;
    let circleClass = 'wday-circle';
    if(isToday) circleClass += ' today';
    else if(isFuture) circleClass += ' future';
    else if(didWork) circleClass += ' did';
    else circleClass += ' missed';
    html += `<div class="wday"><div class="wday-name">${dayNames[i]}</div><div class="${circleClass}">${d.getDate()}</div></div>`;
  }
  container.innerHTML = html;
  const keys = Object.keys(days).filter(k => days[k].sets && days[k].sets.length > 0).sort();
  let cur = 0;
  const dd = new Date(now); dd.setHours(0,0,0,0);
  const tmp2 = new Date(dd);
  while(days[dateKey(tmp2)] && days[dateKey(tmp2)].sets && days[dateKey(tmp2)].sets.length > 0){ cur++; tmp2.setDate(tmp2.getDate() - 1); }
  document.getElementById('mini-streak').textContent = cur;
  document.getElementById('mini-total').textContent = keys.length;
}

// CALENDAR
let calYear = new Date().getFullYear(), calMonth = new Date().getMonth();
function renderCalendar(){
  document.getElementById('cal-title').textContent = calYear + '년 ' + (calMonth + 1) + '월';
  const days = JSON.parse(localStorage.getItem('wc_days') || '{}');
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const totalDays = new Date(calYear, calMonth + 1, 0).getDate();
  const todayKey = dateKey(new Date());
  let html = '';
  for(let i = 0; i < firstDay; i++) html += '<div></div>';
  for(let d = 1; d <= totalDays; d++){
    const key = calYear + '-' + String(calMonth + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    let cls = 'cal-day';
    if(key === todayKey) cls += ' today';
    if(days[key] && days[key].sets && days[key].sets.length > 0) cls += ' did-workout';
    html += '<div class="' + cls + '">' + d + '</div>';
  }
  document.getElementById('cal-days').innerHTML = html;

  const keys = Object.keys(days).filter(k => days[k].sets && days[k].sets.length > 0).sort();
  const daySet = new Set(keys);
  let cur = 0, best = 0, tmp = 0;
  const d2 = new Date(); d2.setHours(0,0,0,0);
  const dd2 = new Date(d2);
  while(daySet.has(dateKey(dd2))){ cur++; dd2.setDate(dd2.getDate() - 1); }
  for(let i = 0; i < keys.length; i++){
    if(i > 0){
      const prev = new Date(keys[i-1]), c = new Date(keys[i]);
      if((c - prev) / 86400000 === 1) tmp++; else tmp = 1;
    } else tmp = 1;
    if(tmp > best) best = tmp;
  }
  document.getElementById('cur-streak').textContent = cur;
  document.getElementById('best-streak').textContent = best;
  document.getElementById('total-days').textContent = keys.length;
}

document.getElementById('cal-prev').addEventListener('pointerdown', e => { e.preventDefault(); calMonth--; if(calMonth < 0){ calMonth = 11; calYear--; } renderCalendar(); });
document.getElementById('cal-next').addEventListener('pointerdown', e => { e.preventDefault(); calMonth++; if(calMonth > 11){ calMonth = 0; calYear++; } renderCalendar(); });

// HISTORY PAGE
function renderHistory(){
  const records = JSON.parse(localStorage.getItem('wc_records') || '[]');
  const list = document.getElementById('history-list');
  if(!records.length){ list.innerHTML = '<div style="color:var(--text4);text-align:center;padding:40px 0">기록이 없습니다.</div>'; return; }
  const groups = {};
  records.forEach(r => {
    const d = new Date(r.time), dk = d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
    if(!groups[dk]) groups[dk] = [];
    groups[dk].push(r);
  });
  let html = '';
  Object.keys(groups).forEach(dk => {
    html += '<div class="history-day"><div class="history-date">' + dk + '</div>';
    groups[dk].forEach(r => {
      const t = new Date(r.time);
      const timeStr = String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
      html += `<div class="history-card">
        <div><div class="history-ex">${r.ex}</div><div class="history-meta">세트 ${r.set} · ${timeStr}</div></div>
        <div class="history-count">${r.count}개</div>
      </div>`;
    });
    html += '</div>';
  });
  list.innerHTML = html;
}
document.getElementById('clear-history-btn').addEventListener('pointerdown', e => {
  e.preventDefault();
  if(confirm('모든 기록을 삭제할까요?')){
    localStorage.removeItem('wc_records'); localStorage.removeItem('wc_days');
    renderHistory(); renderWeeklyStrip(); showToast('기록 삭제됨');
  }
});

// SETTINGS UI
function syncSettingsUI(){
  document.getElementById('s-baseGoal').textContent = cfg.baseGoal;
  document.getElementById('s-cooldown').textContent = cfg.cooldown.toFixed(1) + 's';
  document.getElementById('s-restTime').textContent = cfg.restTime + 's';
  document.getElementById('s-decay-sub').textContent = '세트당 ' + cfg.goalDecay + '개씩 줄어듦';
  document.getElementById('t-goalDecay').classList.toggle('on', !!cfg.goalDecayOn);
  document.getElementById('t-cooldown').classList.toggle('on', !!cfg.cooldownOn);
  document.getElementById('t-restTime').classList.toggle('on', !!cfg.restTimeOn);
  document.getElementById('t-sound').classList.toggle('on', !!cfg.sound);
  document.getElementById('t-vibration').classList.toggle('on', !!cfg.vibration);
}

document.querySelectorAll('.step-btn').forEach(btn => {
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    const key = btn.dataset.setting, delta = parseFloat(btn.dataset.delta), meta = settingMeta[key];
    cfg[key] = Math.round((Math.min(meta.max, Math.max(meta.min, cfg[key] + delta))) * 10) / 10;
    saveCfg(); syncSettingsUI();
    if(key === 'baseGoal') updateGoalDisplay();
    playClick(600, 0.03);
  });
});

document.querySelectorAll('.toggle').forEach(t => {
  t.addEventListener('pointerdown', e => {
    e.preventDefault();
    const key = t.dataset.setting;
    cfg[key] = !cfg[key]; saveCfg(); syncSettingsUI();
    if(key === 'goalDecayOn') updateGoalDisplay();
    playClick(700, 0.03);
  });
});

// EXERCISE EDITOR
document.getElementById('edit-ex-btn').addEventListener('pointerdown', e => { e.preventDefault(); openExModal(); });
document.getElementById('close-ex-modal').addEventListener('pointerdown', e => { e.preventDefault(); closeExModal(); });
document.getElementById('ex-modal').addEventListener('pointerdown', e => { if(e.target === document.getElementById('ex-modal')) closeExModal(); });
function openExModal(){ document.getElementById('ex-modal').classList.add('open'); renderExEditList(); }
function closeExModal(){ document.getElementById('ex-modal').classList.remove('open'); renderExChips(); }
function renderExEditList(){
  const list = document.getElementById('ex-edit-list');
  const exList = getExercises();
  list.innerHTML = exList.map((name, i) => `<div class="ex-edit-item"><input class="ex-edit-name" value="${name}" maxlength="10" data-idx="${i}"><button class="ex-del-btn" data-idx="${i}">✕</button></div>`).join('');
  list.querySelectorAll('.ex-edit-name').forEach(inp => { inp.addEventListener('change', () => { const el = getExercises(); el[parseInt(inp.dataset.idx)] = inp.value.trim() || el[parseInt(inp.dataset.idx)]; saveExercises(el); }); });
  list.querySelectorAll('.ex-del-btn').forEach(btn => { btn.addEventListener('pointerdown', e => { e.preventDefault(); const el = getExercises(); if(el.length <= 1){ showToast('최소 1개는 있어야 해요'); return; } el.splice(parseInt(btn.dataset.idx), 1); saveExercises(el); renderExEditList(); }); });
}
document.getElementById('add-ex-btn').addEventListener('pointerdown', e => {
  e.preventDefault(); const inp = document.getElementById('new-ex-input'); const name = inp.value.trim(); if(!name) return;
  const el = getExercises(); el.push(name); saveExercises(el); inp.value = ''; renderExEditList();
});

// TABS
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('pointerdown', e => {
    e.preventDefault();
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.page).classList.add('active');
    if(tab.dataset.page === 'cal-page') renderCalendar();
    if(tab.dataset.page === 'history-page') renderHistory();
    if(tab.dataset.page === 'settings-page') syncSettingsUI();
  });
});

// CONTROLS
document.getElementById('big-btn').addEventListener('pointerdown', e => { e.preventDefault(); increment(); });
document.getElementById('undo-btn').addEventListener('pointerdown', e => { e.preventDefault(); undo(); });
document.getElementById('reset-btn').addEventListener('pointerdown', e => { e.preventDefault(); resetCount(); });
document.getElementById('set-done-btn').addEventListener('pointerdown', e => { e.preventDefault(); completeSet(); });
document.getElementById('skip-rest').addEventListener('pointerdown', e => { e.preventDefault(); stopSetRest(); });
document.getElementById('goal-minus').addEventListener('pointerdown', e => { e.preventDefault(); cfg.baseGoal = Math.max(1, cfg.baseGoal - 1); saveCfg(); updateGoalDisplay(); syncSettingsUI(); });
document.getElementById('goal-plus').addEventListener('pointerdown', e => { e.preventDefault(); cfg.baseGoal = Math.min(999, cfg.baseGoal + 1); saveCfg(); updateGoalDisplay(); syncSettingsUI(); });
document.body.addEventListener('pointerdown', e => { if(e.target === document.body) increment(); });
document.addEventListener('keydown', e => {
  if(e.repeat || e.ctrlKey || e.metaKey) return;
  if(!document.getElementById('workout-page').classList.contains('active')) return;
  if(document.getElementById('ex-modal').classList.contains('open')) return;
  increment();
});

// INIT
cooldownArc.style.strokeDasharray = CIRCUMFERENCE;
cooldownArc.style.strokeDashoffset = CIRCUMFERENCE;
renderExChips();
updateGoalDisplay();
syncSettingsUI();
renderWeeklyStrip();
</script>
</body>
</html>
